name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 允许在功能分支上手动验证，先跑通再合入 main。
  workflow_dispatch:

jobs:
  # 前端：类型检查 + 生产构建（TS 即 lint 一部分），并做依赖安全审计
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check version consistency
        run: npm run check:version
      - name: Check documentation links
        run: npm run check:docs
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Unit tests (vitest)
        run: npm test
      - name: Type-check & build
        run: npm run build
      - name: Security audit (production dependencies)
        # 生产依赖存在 high 及以上漏洞时阻断；devDependencies 的 Vite/launch-editor
        # 通告暂无修复，单独报告但不阻断（不进入发布产物）。
        run: npm audit --omit=dev --audit-level=high
      - name: Security audit (all dependencies, advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  # 后端：格式 + lint(clippy) + 编译，Linux 需安装 WebKit 系统依赖
  # ubuntu-20.04 runner 已被 GitHub 淘汰（2025-04 起不可用），升到 24.04
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint (clippy)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
