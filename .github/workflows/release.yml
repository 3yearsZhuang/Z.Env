name: Release

# 触发方式：
#  - 推送 v* 标签（如 v0.6.6）
#  - 或手动 workflow_dispatch
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 三平台自动打包：macOS(dmg) / Windows(msi-nsis) / Linux(appimage|deb)
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-20.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin x86_64-apple-darwin' || '' }}
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # macOS：导入 Developer ID 证书到 keychain（用于 codesign + 公证）。
      # 未配置 APPLE_CERTIFICATE 时跳过，仍按 ad-hoc 打包。
      - name: Import Apple certificate (macOS signing)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/apple.p12
          security create-keychain -p trae build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p trae build.keychain
          security import /tmp/apple.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k trae build.keychain
      - name: Build & publish artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Z.Env v__VERSION__"
          releaseBody: |
            - **Z.Env** 自动打包产物（macOS / Windows / Linux）
            - 由 [GitHub Actions](https://github.com/features/actions) 在干净环境构建
            - 失败即中止，产物不可复现即视为发布失败
          releaseDraft: true
          prerelease: false