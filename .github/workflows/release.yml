name: Release

# 触发方式：
#  - 推送 v* 标签（如 v0.6.6）
#  - 或手动 workflow_dispatch
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 三平台自动打包：macOS(dmg) / Windows(msi-nsis) / Linux(appimage|deb)
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux 用 22.04 而非 24.04：AppImage 产物依赖构建机的 glibc，
        # 22.04 兼容更老的发行版（20.04 runner 已被 GitHub 淘汰，不可再用）
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin x86_64-apple-darwin' || '' }}
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # macOS 签名：当前未配置 Developer ID 证书，tauri.conf 的 signingIdentity "-" 走 ad-hoc 签名。
      # 切勿在 Build 步骤注入空的 APPLE_* / TAURI_SIGNING_IDENTITY 环境变量——
      # 空值会覆盖 "-" 并触发 `security import` 失败。
      # 日后配置证书后，需在此补回证书导入步骤并在 Build 注入对应 APPLE_* env。
      - name: Build & publish artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 应用内更新签名：私钥需配置到 GitHub Secrets（本地生成于 ~/.tauri/zenv.key，无密码）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Z.Env v__VERSION__"
          releaseBody: |
            - **Z.Env** 自动打包产物（macOS / Windows / Linux）
            - 由 [GitHub Actions](https://github.com/features/actions) 在干净环境构建
            - 失败即中止，产物不可复现即视为发布失败
          releaseDraft: true
          prerelease: false